<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1a1a" />
    <title>spacechip</title>
    <style>
      body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;background:#0b1a1a;color:#e5e7eb}
      .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
      .card{max-width:520px;width:100%;background:rgba(31,41,55,.55);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px}
      h1{margin:0 0 8px;font-size:18px}
      p{margin:0 0 14px;opacity:.8;line-height:1.5}
      a{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:9999px;background:linear-gradient(90deg,#f27457,#145454);color:#fff;text-decoration:none;font-weight:800}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>You’re offline</h1>
        <p>Connect to the internet and try again.</p>
        <a href="/">Reload</a>
      </div>
    </div>
  </body>
</html>
